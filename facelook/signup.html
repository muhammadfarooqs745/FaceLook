<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign Up for Facelook</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body class="auth-container">

  <div class="auth-card" style="max-width: 480px;">
    <div style="border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 16px;">
      <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main);">Sign Up</h2>
      <p style="font-size: 14px; color: var(--text-secondary);">It's quick and easy.</p>
    </div>

    <form id="signupForm" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <input type="text" id="firstNameInput" class="form-control" placeholder="First name" required>
        </div>
        <div class="form-group">
          <input type="text" id="lastNameInput" class="form-control" placeholder="Last name" required>
        </div>
      </div>

      <div class="form-group">
        <input type="text" id="usernameInput" class="form-control" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <input type="email" id="emailInput" class="form-control" placeholder="Email address" required>
      </div>

      <div class="form-group">
        <input type="password" id="passwordInput" class="form-control" placeholder="New password" required>
        <div class="password-strength-meter">
          <div id="strengthBar" class="password-strength-bar"></div>
        </div>
        <div id="strengthText" class="password-strength-text">Password strength</div>
      </div>

      <div class="form-group">
        <label class="form-label">Birthday</label>
        <div class="form-row">
          <select class="form-control"><option>Sep</option><option>Oct</option><option>Nov</option></select>
          <select class="form-control"><option>21</option><option>22</option><option>23</option></select>
          <select class="form-control"><option>2000</option><option>1998</option><option>1995</option></select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Gender</label>
        <div style="display:flex; gap:12px;">
          <label style="flex:1; border:1px solid var(--border-color); padding:8px 12px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            Female <input type="radio" name="gender" value="female">
          </label>
          <label style="flex:1; border:1px solid var(--border-color); padding:8px 12px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            Male <input type="radio" name="gender" value="male" checked>
          </label>
          <label style="flex:1; border:1px solid var(--border-color); padding:8px 12px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            Custom <input type="radio" name="gender" value="custom">
          </label>
        </div>
      </div>

      <p style="font-size: 11px; color: var(--text-muted); line-height: 1.4;">
        By clicking Sign Up, you agree to our <a href="about.html" style="color:var(--primary);">Terms</a>, <a href="privacy.html" style="color:var(--primary);">Privacy Policy</a> and <a href="#" style="color:var(--primary);">Cookies Policy</a>.
      </p>

      <button type="submit" class="btn btn-success btn-lg btn-block">Sign Up</button>

      <div class="text-center mt-12">
        <a href="login.html" style="color:var(--primary); font-size:14px; text-decoration:none;">Already have an account?</a>
      </div>
    </form>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
