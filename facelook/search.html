<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search Results — Facelook</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo-brand">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#1877F2"/>
          <path d="M25 14H21.5C20.1193 14 19 15.1193 19 16.5V20H15V24H19V32H23V24H26.5L27 20H23V17C23 16.4477 23.4477 16 24 16H25V14Z" fill="white"/>
        </svg>
        <span>Facelook</span>
      </a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search..." onkeydown="if(event.key==='Enter') executeSearch(this.value)">
      </div>
    </div>
    <div class="nav-right">
      <a href="index.html" class="btn btn-secondary btn-sm">Feed</a>
    </div>
  </nav>

  <div style="max-width: 700px; margin: 80px auto 40px auto; padding: 0 16px;">
    <h2 id="searchResultsTitle" style="margin-bottom:16px;">Search Results</h2>
    
    <!-- PEOPLE SECTION -->
    <h3 style="font-size:18px; margin: 16px 0 8px 0;">People</h3>
    <div class="card p-16" id="usersResultList"></div>

    <!-- POSTS SECTION -->
    <h3 style="font-size:18px; margin: 24px 0 8px 0;">Posts</h3>
    <div id="postsResultList"></div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reactions.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

  <script>
    function executeSearch(query) {
      document.getElementById("searchInput").value = query;
      document.getElementById("searchResultsTitle").textContent = `Search results for "${query}"`;
      const res = Search.performSearch(query);

      const usersBox = document.getElementById("usersResultList");
      if (res.users.length === 0) {
        usersBox.innerHTML = `<div class="text-muted">No people found.</div>`;
      } else {
        usersBox.innerHTML = res.users.map(u => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-light);">
            <div style="display:flex; align-items:center; gap:12px;">
              <img src="${u.avatar}" class="user-avatar" style="width:44px; height:44px;">
              <div>
                <strong>${Utils.escapeHtml(u.name)}</strong>
                <div style="font-size:12px; color:var(--text-muted);">@${Utils.escapeHtml(u.username)}</div>
              </div>
            </div>
            <a href="profile.html?id=${u.id}" class="btn btn-secondary btn-sm">View Profile</a>
          </div>
        `).join("");
      }

      const postsBox = document.getElementById("postsResultList");
      if (res.posts.length === 0) {
        postsBox.innerHTML = `<div class="card p-16 text-muted">No posts found matching query.</div>`;
      } else {
        postsBox.innerHTML = res.posts.map(p => Posts.renderPostCard(p, Auth.getCurrentUser())).join("");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const q = Utils.getUrlParam("q") || "mark";
      executeSearch(q);
    });
  </script>
</body>
</html>
