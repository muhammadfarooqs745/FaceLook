<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>User Management — Facelook Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/popups.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand"><span>🛡️</span><span>Facelook Admin</span></div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-link">📊 Dashboard</a>
        <a href="users.html" class="admin-nav-link active">👥 User Management</a>
        <a href="posts.html" class="admin-nav-link">📝 Post Moderation</a>
        <a href="reports.html" class="admin-nav-link">🚩 Abuse Reports</a>
        <a href="analytics.html" class="admin-nav-link">📈 Analytics</a>
        <a href="settings.html" class="admin-nav-link">⚙️ System Config</a>
      </nav>
      <div style="padding:16px; border-top:1px solid var(--border-light);">
        <a href="../index.html" class="btn btn-secondary btn-sm btn-block">Exit to Website</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <h3>User Management</h3>
      </header>

      <div class="admin-content">
        <div class="card p-24">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h4>All Registered Accounts</h4>
            <div class="search-box">
              <input type="text" placeholder="Search accounts...">
            </div>
          </div>
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="adminUsersTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-dashboard.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
