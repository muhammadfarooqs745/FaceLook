<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>System Logs & Broadcasts — Facelook Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/popups.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand"><span>🛡️</span><span>Facelook Admin</span></div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-link">📊 Dashboard</a>
        <a href="users.html" class="admin-nav-link">👥 User Management</a>
        <a href="posts.html" class="admin-nav-link">📝 Post Moderation</a>
        <a href="reports.html" class="admin-nav-link">🚩 Abuse Reports</a>
        <a href="analytics.html" class="admin-nav-link">📈 Analytics</a>
        <a href="settings.html" class="admin-nav-link">⚙️ System Config</a>
      </nav>
      <div style="padding:16px; border-top:1px solid var(--border-light);">
        <a href="../index.html" class="btn btn-secondary btn-sm btn-block">Exit to Website</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <h3>Platform Broadcasts</h3>
      </header>

      <div class="admin-content">
        <div class="card p-24">
          <h4>Send Global Notification / Banner</h4>
          <p class="text-muted" style="margin-bottom:16px;">Dispatch an official alert to all registered Facelook accounts.</p>
          <div class="form-group">
            <textarea class="form-control" placeholder="Type notification content..."></textarea>
          </div>
          <button class="btn btn-primary" onclick="Utils.showToast('Global broadcast dispatched successfully!')">Send Broadcast</button>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
