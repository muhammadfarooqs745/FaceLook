<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pages — Facelook</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo-brand">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#1877F2"/>
          <path d="M25 14H21.5C20.1193 14 19 15.1193 19 16.5V20H15V24H19V32H23V24H26.5L27 20H23V17C23 16.4477 23.4477 16 24 16H25V14Z" fill="white"/>
        </svg>
        <span>Facelook</span>
      </a>
      <h3 style="margin-left: 20px; font-size:18px;">Pages</h3>
    </div>
    <div class="nav-right">
      <a href="index.html" class="btn btn-secondary btn-sm">Home</a>
    </div>
  </nav>

  <div style="max-width: 900px; margin: 80px auto 40px auto; padding: 0 16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2>Pages You Follow & Discover</h2>
      <button class="btn btn-primary btn-sm" onclick="Utils.showToast('Page creation portal ready')">+ Create Page</button>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px;">
      
      <div class="card" style="overflow:hidden;">
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600" style="width:100%; height:120px; object-fit:cover;">
        <div class="p-16">
          <h4 style="font-size:16px;">TechRadar World</h4>
          <p style="font-size:12px; color:var(--text-muted); margin:4px 0 12px 0;">Media / News Company • 1.2M followers</p>
          <button class="btn btn-primary btn-block btn-sm" onclick="this.textContent = this.textContent === 'Liked' ? 'Like Page' : 'Liked'; Utils.showToast('Page preferences saved')">Like Page</button>
        </div>
      </div>

      <div class="card" style="overflow:hidden;">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600" style="width:100%; height:120px; object-fit:cover;">
        <div class="p-16">
          <h4 style="font-size:16px;">Modern Web Architect</h4>
          <p style="font-size:12px; color:var(--text-muted); margin:4px 0 12px 0;">Software & Technology • 340K followers</p>
          <button class="btn btn-primary btn-block btn-sm" onclick="this.textContent = this.textContent === 'Liked' ? 'Like Page' : 'Liked'; Utils.showToast('Page preferences saved')">Like Page</button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
