<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abuse Reports — Facelook Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/popups.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand"><span>🛡️</span><span>Facelook Admin</span></div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-link">📊 Dashboard</a>
        <a href="users.html" class="admin-nav-link">👥 User Management</a>
        <a href="posts.html" class="admin-nav-link">📝 Post Moderation</a>
        <a href="reports.html" class="admin-nav-link active">🚩 Abuse Reports</a>
        <a href="analytics.html" class="admin-nav-link">📈 Analytics</a>
        <a href="settings.html" class="admin-nav-link">⚙️ System Config</a>
      </nav>
      <div style="padding:16px; border-top:1px solid var(--border-light);">
        <a href="../index.html" class="btn btn-secondary btn-sm btn-block">Exit to Website</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <h3>Abuse & Flagged Content Reports</h3>
      </header>

      <div class="admin-content">
        <div class="card p-24">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h4>Report Queue</h4>
            <span class="badge badge-success">0 Critical</span>
          </div>

          <p class="text-muted" style="padding: 24px 0; text-align: center;">
            ✨ No unresolved reports in the queue. All community standards are currently in compliance!
          </p>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
