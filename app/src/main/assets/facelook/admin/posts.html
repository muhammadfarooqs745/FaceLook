<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Post Moderation — Facelook Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/popups.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand"><span>🛡️</span><span>Facelook Admin</span></div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-link">📊 Dashboard</a>
        <a href="users.html" class="admin-nav-link">👥 User Management</a>
        <a href="posts.html" class="admin-nav-link active">📝 Post Moderation</a>
        <a href="reports.html" class="admin-nav-link">🚩 Abuse Reports</a>
        <a href="analytics.html" class="admin-nav-link">📈 Analytics</a>
        <a href="settings.html" class="admin-nav-link">⚙️ System Config</a>
      </nav>
      <div style="padding:16px; border-top:1px solid var(--border-light);">
        <a href="../index.html" class="btn btn-secondary btn-sm btn-block">Exit to Website</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <h3>Post Moderation</h3>
      </header>

      <div class="admin-content">
        <div class="card p-24">
          <h4 style="margin-bottom:16px;">Published Content Stream</h4>
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Author</th>
                  <th>Content Preview</th>
                  <th>Reactions</th>
                  <th>Status</th>
                  <th>Moderation</th>
                </tr>
              </thead>
              <tbody id="adminPostsTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const posts = FacelookConfig.getLocalCollection("posts") || [];
      const tbody = document.getElementById("adminPostsTableBody");
      tbody.innerHTML = posts.map(p => `
        <tr>
          <td><strong>${Utils.escapeHtml(p.authorName)}</strong></td>
          <td style="max-width:320px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${Utils.escapeHtml(p.content)}</td>
          <td>${p.likesCount || 0}</td>
          <td><span class="status-pill active">Published</span></td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="App.openDeletePostModal('${p.id}')">Delete</button>
          </td>
        </tr>
      `).join("");
    });
  </script>
</body>
</html>
