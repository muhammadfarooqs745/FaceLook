<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Portal — Facelook</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/popups.css">
</head>
<body class="auth-container">

  <div class="auth-card" style="max-width: 440px;">
    <div style="text-align:center; margin-bottom: 20px;">
      <div style="font-size:36px;">🛡️</div>
      <h2 style="font-size:24px; font-weight:800; color:var(--text-main); margin-top:8px;">Facelook Admin Portal</h2>
      <p style="font-size:13px; color:var(--text-secondary);">Restricted administrative console</p>
    </div>

    <form id="adminLoginForm" class="auth-form">
      <div class="form-group">
        <label class="form-label">Admin Email</label>
        <input type="email" id="adminEmailInput" class="form-control" required value="zuck@facelook.com">
      </div>

      <div class="form-group">
        <label class="form-label">Security Password</label>
        <input type="password" id="adminPasswordInput" class="form-control" required value="admin123">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Authenticate</button>
      <div style="text-align:center; margin-top:16px;">
        <a href="../index.html" style="font-size:13px; color:var(--text-secondary); text-decoration:none;">← Return to Main Website</a>
      </div>
    </form>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-dashboard.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
