<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stories — Facelook</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo-brand">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#1877F2"/>
          <path d="M25 14H21.5C20.1193 14 19 15.1193 19 16.5V20H15V24H19V32H23V24H26.5L27 20H23V17C23 16.4477 23.4477 16 24 16H25V14Z" fill="white"/>
        </svg>
        <span>Facelook</span>
      </a>
      <h3 style="margin-left: 20px; font-size:18px;">Stories Archive</h3>
    </div>
    <div class="nav-right">
      <a href="index.html" class="btn btn-secondary btn-sm">Home</a>
    </div>
  </nav>

  <div style="max-width: 900px; margin: 80px auto 40px auto; padding: 0 16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2>Active Stories</h2>
      <button class="btn btn-primary btn-sm" onclick="App.openModal('modalCreateStory')">+ Create a Story</button>
    </div>

    <div class="stories-container" id="storiesArchiveList" style="flex-wrap:wrap; height:auto; overflow-x:visible;"></div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Stories.renderStories("storiesArchiveList");
    });
  </script>
</body>
</html>
