<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset Password — Facelook</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body class="auth-container">

  <div class="auth-card" style="max-width: 440px;">
    <div style="border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 16px;">
      <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main);">Find Your Account</h2>
      <p style="font-size: 14px; color: var(--text-secondary); margin-top:4px;">
        Please enter your email address or username to search for your account.
      </p>
    </div>

    <form onsubmit="event.preventDefault(); Utils.showToast('Password recovery instructions sent to your email.'); setTimeout(()=>window.location.href='login.html', 1500);" class="auth-form">
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Email address or username" required autofocus>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:12px;">
        <button type="button" class="btn btn-secondary" onclick="window.location.href='login.html'">Cancel</button>
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
