<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Post — Facelook</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo-brand">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#1877F2"/>
          <path d="M25 14H21.5C20.1193 14 19 15.1193 19 16.5V20H15V24H19V32H23V24H26.5L27 20H23V17C23 16.4477 23.4477 16 24 16H25V14Z" fill="white"/>
        </svg>
        <span>Facelook</span>
      </a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="btn btn-secondary btn-sm">Cancel</a>
    </div>
  </nav>

  <div style="max-width: 600px; margin: 80px auto 40px auto; padding: 0 16px;">
    <div class="card p-24">
      <h2 style="font-size:20px; font-weight:800; border-bottom:1px solid var(--border-light); padding-bottom:12px; margin-bottom:16px;">Create Post</h2>

      <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
        <img id="creatorAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="user-avatar">
        <div>
          <strong id="creatorName">Mark Zuckerberg</strong>
          <select id="postAudienceSelect" style="display:block; margin-top:2px; padding:4px 8px; border-radius:4px; border:1px solid var(--border-light); background:var(--bg-input);">
            <option value="public">🌐 Public</option>
            <option value="friends">👥 Friends</option>
            <option value="only_me">🔒 Only me</option>
          </select>
        </div>
      </div>

      <textarea id="pagePostContent" class="form-control" style="min-height:140px; font-size:16px; border:none; resize:none;" placeholder="What's on your mind?"></textarea>

      <div style="border:1px dashed var(--border-color); border-radius:var(--radius-sm); padding:20px; text-align:center; margin:16px 0;">
        <label style="cursor:pointer; font-weight:600; color:var(--primary);">
          📷 Choose Photo or Video
          <input type="file" id="pageMediaFile" style="display:none;" accept="image/*,video/*">
        </label>
        <div id="pageMediaPreview" style="margin-top:12px;"></div>
      </div>

      <button type="button" class="btn btn-primary btn-block btn-lg" onclick="handlePublish()">Publish to Feed</button>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/app.js"></script>

  <script>
    let uploadedMediaUrl = null;

    document.addEventListener("DOMContentLoaded", () => {
      const user = Auth.requireAuth();
      if (!user) return;
      document.getElementById("creatorName").textContent = user.name;
      document.getElementById("creatorAvatar").src = user.avatar;

      document.getElementById("pageMediaFile").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          Upload.readFileAsDataURL(file).then(url => {
            uploadedMediaUrl = url;
            document.getElementById("pageMediaPreview").innerHTML = `<img src="${url}" style="max-height:200px; border-radius:8px;">`;
          });
        }
      });
    });

    function handlePublish() {
      const content = document.getElementById("pagePostContent").value;
      const audience = document.getElementById("postAudienceSelect").value;
      Posts.createPost(content, uploadedMediaUrl, "image", audience);
      setTimeout(() => window.location.href = "index.html", 600);
    }
  </script>
</body>
</html>
