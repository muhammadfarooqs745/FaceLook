<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notifications — Facelook</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo-brand">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#1877F2"/>
          <path d="M25 14H21.5C20.1193 14 19 15.1193 19 16.5V20H15V24H19V32H23V24H26.5L27 20H23V17C23 16.4477 23.4477 16 24 16H25V14Z" fill="white"/>
        </svg>
        <span>Facelook</span>
      </a>
    </div>
    <div class="nav-center">
      <a href="index.html" class="nav-tab">🏠</a>
      <a href="friends.html" class="nav-tab">👥</a>
      <a href="notifications.html" class="nav-tab active">🔔</a>
    </div>
    <div class="nav-right">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="user-avatar nav-user-avatar" onclick="window.location.href='profile.html'">
    </div>
  </nav>

  <div style="max-width: 680px; margin: 80px auto 40px auto; padding: 0 16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2>Notifications</h2>
      <button class="btn btn-secondary btn-sm" onclick="Notifications.markAllAsRead()">Mark all as read</button>
    </div>

    <div class="card p-16" id="notificationsPageList"></div>
  </div>

  <nav class="mobile-bottom-bar">
    <a href="index.html" class="bottom-tab"><span>🏠</span><span>Home</span></a>
    <a href="friends.html" class="bottom-tab"><span>👥</span><span>Friends</span></a>
    <a href="messages.html" class="bottom-tab"><span>💬</span><span>Chat</span></a>
    <a href="notifications.html" class="bottom-tab active"><span>🔔</span><span>Alerts</span></a>
    <a href="profile.html" class="bottom-tab"><span>👤</span><span>Profile</span></a>
  </nav>

  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("notificationsPageList");
      const notifs = FacelookConfig.getLocalCollection("notifications") || [];
      if (notifs.length === 0) {
        container.innerHTML = `<div class="p-16 text-muted text-center">No notifications.</div>`;
        return;
      }
      container.innerHTML = notifs.map(n => `
        <div style="display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border-light); ${!n.read ? 'background:var(--primary-light); border-radius:8px; padding:12px;' : ''}" onclick="window.location.href='${n.targetUrl}'">
          <img src="${n.senderAvatar}" class="user-avatar" style="width:48px; height:48px;">
          <div style="flex:1;">
            <div><strong>${Utils.escapeHtml(n.senderName)}</strong> ${Utils.escapeHtml(n.text)}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${Utils.formatTimeAgo(n.createdAt)}</div>
          </div>
          <span style="font-size:18px;">${n.type === 'reaction' ? '❤️' : '💬'}</span>
        </div>
      `).join("");
    });
  </script>
</body>
</html>
